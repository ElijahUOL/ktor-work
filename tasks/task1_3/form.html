<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 1.3</title>
</head>
<body>
<form action="https://httpbin.io/dump/request" method="POST">
    <p>
    <label for="nm">Enter your name:</label>
    <input type="text" id="nm" name="name">
    </p>
    <p>
    <label for="em">Enter your email:</label>
    <input type="email" id="em" name="email">
    </p>
    <p>
    <label for="dob">Enter your date of birth:</label>
    <input type="date" id="dob" name="date of birth">
    </p>
    <p>
    <label for="fvclr">Select your favourite color:</label>
    <input type="color" id="fvclr" name="favourite colour">
    </p>
    <p>
        <p>Are you a student or staff member?</p>
        <label for="student">Student</label>
        <input type="radio" id="student" name="id" value="student">
        <label for="staff">Staff</label>
        <input type="radio" id="staff" name="id" value="staff member">
    </p>
    <input type="submit">


</form>
</body>
</html>
